name: FreeBand bug or setup problem
description: Report a problem with the FreeBand iOS beta
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the [installation guide](https://github.com/austin17022/freeband/blob/main/docs/FREEBAND_INSTALL.md) and existing FreeBand issues first.
        This report is public. Do not upload health databases, backups, food logs, raw strap logs, account details, or API keys.
  - type: input
    id: version
    attributes:
      label: FreeBand version and build
      placeholder: "11.8.1, build 416"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version
    validations:
      required: true
  - type: input
    id: strap
    attributes:
      label: Strap model
      placeholder: "WHOOP 4.0, 5.0, MG, or not sure"
    validations:
      required: true
  - type: input
    id: installation
    attributes:
      label: Installation method
      placeholder: "AltStore Classic, SideStore, Sideloadly, or Xcode"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, and actual result
      description: Include the exact error message. Remove personal information from any screenshot.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I have removed personal health data, device identifiers, and credentials.
          required: true
